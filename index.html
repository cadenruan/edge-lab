<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edge Lab Backtests</title>
<meta name="description" content="Every built-in Edge Lab model, backtested on recorded Kalshi NHL and NBA order books: P&L curves and the full paper trade log." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: light;
  --ice: #eef2f5; --board: #ffffff; --board-2: #f5f8fa; --ink: #13203a; --slate: #586679; --faint: #8794a5;
  --line: #d5dde5; --grid: #e3e9ee; --blue: #1f5fae; --red: #b31b1b; --green: #1d7a4c;
  --scoreboard: #13203a; --scoreboard-ink: #f3f6f9; --scoreboard-dim: #a9b6c8; --score-up: #4cd39a; --score-down: #ff8a87;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --text: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ice: #0d1420; --board: #141e2e; --board-2: #18243a; --ink: #e8eef5; --slate: #a3b1c3; --faint: #7a889b;
    --line: #26344a; --grid: #1f2b3e; --blue: #6fa3e6; --red: #e0605e; --green: #4cc38a; --scoreboard: #0a101b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ice: #0d1420; --board: #141e2e; --board-2: #18243a; --ink: #e8eef5; --slate: #a3b1c3; --faint: #7a889b;
  --line: #26344a; --grid: #1f2b3e; --blue: #6fa3e6; --red: #e0605e; --green: #4cc38a; --scoreboard: #0a101b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ice); color: var(--ink); font: 16px/1.5 var(--text); }
a { color: var(--blue); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header.top { background: var(--board); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; padding-bottom: 14px; }
.brand b { display: block; font: 700 26px/1 var(--display); letter-spacing: .01em; }
.brand span { color: var(--slate); font-size: 13px; }
.top nav { display: flex; gap: 18px; font-weight: 600; font-size: 15px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.05; margin: 0; }
.intro { padding: 40px 0 18px; }
.intro h1 { font-size: clamp(34px, 6vw, 56px); max-width: 16ch; }
.intro p { color: var(--slate); max-width: 68ch; font-size: 17px; margin: 14px 0 0; }

.runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin: 26px 0 8px; }
.run { text-align: left; background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 10px;
  cursor: pointer; color: inherit; font: inherit; display: flex; flex-direction: column; gap: 6px; }
.run:hover { border-color: var(--slate); }
.run[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 3px 0 var(--red); }
.run .nm { font: 600 20px/1.1 var(--display); }
.run .lg { font-size: 12px; font-weight: 700; color: var(--slate); letter-spacing: .06em; text-transform: uppercase; }
.run .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.run .pnl { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.run .sub { font-size: 13px; color: var(--slate); }
.run svg { width: 100%; height: 36px; display: block; }
.up { color: var(--green); } .down { color: var(--red); }

.detail { margin: 26px 0 60px; }
.detail .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.detail h2 { font-size: clamp(28px, 4.5vw, 40px); }
.detail .note { color: var(--slate); margin: 8px 0 0; max-width: 75ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 14px 0 0; font-size: 14px; }
.meta span { color: var(--slate); display: block; font-size: 12.5px; }
.meta b { font-weight: 700; }
.score { margin-top: 20px; background: var(--scoreboard); color: var(--scoreboard-ink); border-radius: 8px;
  display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; }
.score > div { padding: 22px 24px; }
.score > div + div { border-left: 1px solid #2a3852; }
.score .lbl { color: var(--scoreboard-dim); font-size: 14px; }
.score .big { font: 700 clamp(48px, 9vw, 86px)/1 var(--display); font-variant-numeric: tabular-nums; margin: 4px 0; }
.score .big.up { color: var(--score-up); } .score .big.down { color: var(--score-down); }
.score .brier { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
.score .brier b { font: 700 36px/1 var(--display); font-variant-numeric: tabular-nums; }
.score .brier.model b { color: #ffcf5c; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin: 22px 0 6px; }
.stats span { display: block; color: var(--slate); font-size: 13.5px; }
.stats b { font: 700 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stats small { display: block; color: var(--slate); font-size: 13px; }
section.block { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 22px; }
section.block h3 { font-size: 26px; }
section.block h3 + .chart, section.block h3 + .tools { margin-top: 12px; }
section.block p.hint { color: var(--slate); margin: 4px 0 12px; font-size: 14.5px; }
.chart { position: relative; background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 10px 6px 4px; }
.chart svg { width: 100%; height: 280px; display: block; }
.chart text { fill: var(--faint); font: 12px var(--text); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--board); font-size: 13px; padding: 5px 8px;
  border-radius: 4px; white-space: nowrap; transform: translate(-50%, -120%); display: none; }
.dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.tools button, .pager button { font: 600 14px var(--text); padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--board); color: var(--ink); cursor: pointer; }
.tools button[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
.tools input { font: 15px var(--text); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--board);
  color: var(--ink); min-width: 0; flex: 1 1 200px; }
.table-wrap { overflow-x: auto; background: var(--board); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--slate); font-weight: 700; font-size: 13px; padding: 9px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.side { font-weight: 700; font-size: 12px; letter-spacing: .05em; }
.side.yes { color: var(--green); } .side.no { color: var(--red); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 14px; color: var(--slate); }
.pager button:disabled { opacity: .45; cursor: default; }
footer { color: var(--slate); font-size: 14px; padding: 0 0 50px; }
footer p { max-width: 75ch; }
pre.code { background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 12px 0 0;
  overflow: auto; max-height: 560px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; tab-size: 4; }
.loading { padding: 60px 0; color: var(--slate); }
@media (max-width: 720px) {
  .score { grid-template-columns: 1fr; }
  .score > div + div { border-left: 0; border-top: 1px solid #2a3852; }
  .top nav { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Edge Lab</b></div>
    <nav><a href="#models">Models</a><a href="#log">Trade log</a><a href="#code">Code</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <h1>Backtest results</h1>
  </div>

  <div id="models" class="runs" role="list"></div>
  <div id="detail" class="detail"><div class="loading">Loading…</div></div>
</main>

<footer class="wrap"><p id="gen"></p></footer>

<script>
const $ = (s, el = document) => el.querySelector(s)
const money = (v) => (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const signed = (v) => (v > 0 ? '+' : '') + money(v)
const pct = (v, d = 1) => v == null ? '—' : (v * 100).toFixed(d) + '%'
const num = (v) => v == null ? '—' : v.toLocaleString('en-US')
const cents = (v) => Math.round(v * 100) + '¢'
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : ''
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const day = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
const when = (ms) => new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' })
const TYPES = { GAME: 'Winner', TOTAL: 'Total goals', TEAMTOTAL: 'Team totals', OT: 'Overtime', SPREAD: 'Spread', PTS: 'Player points' }

let DATA, cur = 0, filter = 'all', query = '', page = 0
const PER = 50

fetch('data.json').then((r) => r.json()).then((d) => {
  DATA = d
  $('#gen').textContent = `Updated ${d.generated}.`
  const want = new URLSearchParams(location.hash.slice(1)).get('run')
  const i = d.runs.findIndex((r) => slug(r.name) === want)
  cur = i >= 0 ? i : 0
  cards(); show()
}).catch(() => { $('#detail').innerHTML = '<div class="loading">Couldn’t load data.json.</div>' })

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')

function spark(eq, w = 240, h = 36) {
  if (eq.length < 2) return ''
  const xs = eq.map((p) => p[0]), ys = eq.map((p) => p[1])
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys)
  const X = (x) => (x - x0) / (x1 - x0 || 1) * w, Y = (y) => h - 3 - (y - y0) / (y1 - y0 || 1) * (h - 6)
  const up = ys[ys.length - 1] >= ys[0]
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="var(${up ? '--green' : '--red'})" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${eq.map((p) => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/></svg>`
}

function cards() {
  $('#models').innerHTML = DATA.runs.map((r, i) => {
    const m = r.metrics
    return `<button class="run" role="listitem" aria-pressed="${i === cur}" data-i="${i}">
      <span class="lg">${r.league} · ${r.types.map((t) => TYPES[t] || t).join(', ')}</span>
      <span class="nm">${esc(r.name)}</span>
      <span class="row"><span class="pnl ${cls(m.pnl)}">${signed(m.pnl)}</span><span class="sub">${num(m.trades)} trades · ${pct(m.win_rate, 0)} won</span></span>
      ${spark(r.equity)}
    </button>`
  }).join('')
  document.querySelectorAll('.run').forEach((b) => b.onclick = () => {
    cur = +b.dataset.i; page = 0; filter = 'all'; query = ''
    history.replaceState(null, '', '#run=' + slug(DATA.runs[cur].name))
    cards(); show(); $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' })
  })
}

function show() {
  const r = DATA.runs[cur], m = r.metrics
  $('#detail').innerHTML = `
    <div class="head"><h2>${esc(r.full_name)}</h2></div>
    <p class="note">${esc(r.note)}</p>
    <div class="meta">
      <div><span>League</span><b>${r.league}</b></div>
      <div><span>Markets</span><b>${r.types.map((t) => TYPES[t] || t).join(', ')}</b></div>
      <div><span>Games</span><b>${day(r.date_from)} to ${day(r.date_to)}${m.games ? ` (${m.games})` : ''}</b></div>
      <div><span>Starting bankroll</span><b>${money(r.bankroll)}</b></div>
    </div>
    <div class="score">
      <div>
        <div class="lbl">Profit</div>
        <div class="big ${cls(m.pnl)}">${signed(m.pnl)}</div>
        <div class="lbl">${pct(m.roi_on_bankroll)} on a ${money(r.bankroll)} bankroll</div>
      </div>
      <div>
        <div class="brier model"><span class="lbl">Model Brier</span><b>${m.brier_model?.toFixed(4) ?? '—'}</b></div>
        <div class="brier"><span class="lbl">Market Brier</span><b>${m.brier_market?.toFixed(4) ?? '—'}</b></div>
      </div>
    </div>
    <div class="stats">
      <div><span>Trades won</span><b>${pct(m.win_rate)}</b><small>${num(m.trades)} trades</small></div>
      <div><span>Return on money staked</span><b class="${cls(m.roi_on_staked)}">${pct(m.roi_on_staked)}</b><small>${money(m.staked || 0)} staked</small></div>
      <div><span>Contracts bought</span><b>${num(m.contracts)}</b><small>average ${m.avg_price != null ? cents(m.avg_price) : '—'}</small></div>
      <div><span>Worst drawdown</span><b>${money(m.max_drawdown || 0)}</b><small>Sharpe per trade ${m.sharpe_per_trade?.toFixed(3) ?? '—'}</small></div>
      <div><span>Fees paid</span><b>${money(m.fees || 0)}</b><small>profit factor ${m.profit_factor?.toFixed(2) ?? '—'}</small></div>
    </div>
    <section class="block">
      <h3>Bankroll</h3>
      <div class="chart" id="chart"></div>
    </section>
    <section class="block" id="log">
      <h3>Trade log</h3>
      <div class="tools">
        <button data-f="all">All</button><button data-f="won">Won</button><button data-f="lost">Lost</button>
        <input type="search" placeholder="Team or player" aria-label="Filter trades" />
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Time (ET)</th><th>Market</th><th>Side</th><th class="n">Contracts</th><th class="n">Price</th><th class="n">Model P(yes)</th><th class="n">Fee</th><th class="n">P&amp;L</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="pager" id="pager"></div>
    </section>
    <section class="block" id="code">
      <h3>Code</h3>
      <pre class="code"><code>${esc(r.code)}</code></pre>
    </section>`
  chart(r.equity, r.bankroll)
  document.querySelectorAll('.tools button').forEach((b) => b.onclick = () => { filter = b.dataset.f; page = 0; rows() })
  const inp = $('.tools input'); inp.value = query
  inp.oninput = () => { query = inp.value.trim().toLowerCase(); page = 0; rows() }
  rows()
}

function rows() {
  const all = DATA.runs[cur].trades.filter((t) =>
    (filter === 'all' || (filter === 'won' ? t[7] === 1 : t[7] === 0)) && (!query || t[1].toLowerCase().includes(query)))
  document.querySelectorAll('.tools button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.f === filter))
  const pages = Math.max(1, Math.ceil(all.length / PER)); page = Math.min(page, pages - 1)
  $('#rows').innerHTML = all.slice(page * PER, page * PER + PER).map((t) => `<tr>
    <td>${when(t[0])}</td><td>${esc(t[1])}</td><td><span class="side ${t[2]}">${t[2].toUpperCase()}</span></td>
    <td class="n">${num(t[3])}</td><td class="n">${cents(t[4])}</td><td class="n">${t[6] == null ? '—' : t[6].toFixed(2)}</td>
    <td class="n">${money(t[5])}</td><td class="n ${cls(t[8])}">${t[8] == null ? 'open' : signed(t[8])}</td></tr>`).join('') ||
    '<tr><td colspan="8" style="color:var(--slate)">No trades.</td></tr>'
  $('#pager').innerHTML = `<span>${num(all.length)} trades · page ${page + 1} of ${pages}</span>
    <button ${page === 0 ? 'disabled' : ''} data-d="-1">Previous</button><button ${page >= pages - 1 ? 'disabled' : ''} data-d="1">Next</button>`
  document.querySelectorAll('#pager button').forEach((b) => b.onclick = () => { page += +b.dataset.d; rows() })
}

function chart(eq, bankroll) {
  const el = $('#chart')
  if (eq.length < 2) { el.innerHTML = '<p class="hint" style="padding:12px">No trades.</p>'; return }
  const W = 1000, H = 280, L = 64, R = 12, T = 12, B = 28
  const xs = eq.map((p) => p[0]), ys = eq.map((p) => p[1]).concat([bankroll])
  const x0 = Math.min(...xs), x1 = Math.max(...xs)
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad
  const X = (x) => L + (x - x0) / (x1 - x0 || 1) * (W - L - R), Y = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B)
  const step = niceStep((y1 - y0) / 5), ticks = []
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) ticks.push(v)
  const days = [], d0 = new Date(x0)
  const span = (x1 - x0) / 864e5, every = span > 20 ? 7 : span > 8 ? 3 : 1
  for (let d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1); +d <= x1; d.setDate(d.getDate() + every)) days.push(+d)
  const end = eq[eq.length - 1][1], color = end >= bankroll ? 'var(--green)' : 'var(--red)'
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bankroll from ${money(bankroll)} to ${money(end)}">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" vector-effect="non-scaling-stroke"/>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${Y(bankroll)}" y2="${Y(bankroll)}" stroke="var(--faint)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"
      points="${eq.map((p) => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>
  </svg><div class="tip" id="tip"></div><div class="dot" id="dot" style="background:${color}"></div>`
  // axis labels as HTML so they don't stretch with the SVG
  const svg = $('svg', el)
  const labels = ticks.map((v) => `<div style="position:absolute;left:4px;top:${(Y(v) / H * 280 + 10 - 8)}px;font-size:12px;color:var(--faint)">${money(v).replace('.00', '')}</div>`).join('') +
    days.map((d) => `<div style="position:absolute;left:calc(${X(d) / W * 100}% );bottom:4px;transform:translateX(-50%);font-size:12px;color:var(--faint)">${new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>`).join('')
  el.insertAdjacentHTML('beforeend', labels)
  const tip = $('#tip'), dot = $('#dot')
  svg.onmousemove = (e) => {
    const b = svg.getBoundingClientRect(), x = x0 + ((e.clientX - b.left) / b.width * W - L) / (W - L - R) * (x1 - x0)
    let lo = 0, hi = eq.length - 1
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (eq[mid][0] <= x) lo = mid; else hi = mid - 1 }
    const p = eq[lo]
    const px = X(p[0]) / W * b.width + 6, py = Y(p[1]) / H * b.height + 10
    dot.style.display = 'block'; dot.style.left = px + 'px'; dot.style.top = py + 'px'
    tip.style.display = 'block'; tip.style.left = px + 'px'; tip.style.top = py + 'px'
    tip.textContent = `${when(p[0])}: ${money(p[1])}`
  }
  svg.onmouseleave = () => { tip.style.display = 'none'; dot.style.display = 'none' }
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p
}
</script>
</body>
</html>
